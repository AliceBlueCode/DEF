version: 2
# main は v4.2.1 で凍結中。更新は v5.0 の作業ブランチに向ける（v5.0 を main にマージしたら、
# target-branch の行を消す）。この設定は既定のブランチ（main）のものだけが読まれる。
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "feature/multi-rulebook"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # セキュリティ影響の大きい依存は個別にレビューしやすいようグルーピングしない。
    # PyJWT / cryptography / Pillow は特にセキュリティ影響が大きいため
    # PRタイトルで見分けやすいよう先頭アルファベット順のまま個別更新とする。

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "feature/multi-rulebook"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "feature/multi-rulebook"
    schedule:
      interval: "monthly"
