version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # セキュリティ影響の大きい依存は個別にレビューしやすいようグルーピングしない。
    # python-jose / cryptography / Pillow は特にセキュリティ影響が大きいため
    # PRタイトルで見分けやすいよう先頭アルファベット順のまま個別更新とする。

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
