name: pip-audit

on:
  push:
    paths:
      - "requirements.txt"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/pip-audit.yml"
  schedule:
    # 依存自体に変更がなくても新規CVEが公表され得るため週次でも実行する
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt             --ignore-vuln PYSEC-2022-252
        # 既知脆弱性が見つかった場合はデフォルトで非ゼロ終了し、このジョブを失敗させる。
        # PyJWT / cryptography / Pillow は本プロジェクトのセキュリティ上
        # 特に重要な依存であるため、失敗時は優先的に確認すること。
        #
        # ignoreは「脆弱性そのものが存在しない誤検知」に限る。実在する脆弱性は依存の
        # 更新・置き換えで解消する（2026-10-24、fastapi<0.96固定の解除とpython-jose→PyJWT
        # 置き換えにより、fastapi/h11/starlette/ecdsa/anyio/python-jose由来の受け入れ済み
        # ignore計10件を撤去した）。
        #
        # 以下は個別調査の上で誤検知と判断したため無視する:
        # - PYSEC-2022-252: deep-translator。2022年8月にPyPIアカウントが乗っ取られ
        #   悪意あるリリース（1.8.5）が公開された実際のインシデントに由来するが、
        #   当該リリースはPyPIから削除されアカウントは正規化済み。このアドバイザリは
        #   「fixed」の境界を持たない開放範囲になっており、1.8.5以降の正規リリース
        #   （現行1.11.4は2023年6月公開、以後3年以上撤回されず現行版）まで機械的に
        #   巻き込んでいる。GitHub Security Advisoryにも未登録。調査の詳細は
        #   TODO.mdを参照。
