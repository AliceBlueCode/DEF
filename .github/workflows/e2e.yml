name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_slow:
        description: "keepalive・all-disconnect-autostop(実時間で計~7分)も実行する"
        type: boolean
        default: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # guest_onboarding.jsは公開ポート(dual_run.pyのpublic_main.pyが配信する
      # frontend/dist)経由の実ゲスト体験そのものを検証するため、ビルド成果物が
      # 事前に必要（2026-08-23）。副産物として、このリポジトリのTSビルドが
      # CIで初めて検証されるようになる。
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # DEBIAN_FRONTEND未設定だと--with-deps経由のapt-get installが対話プロンプト待ちで
      # ハングすることがある(実CI実行で2回連続、同一ステップで15分超ハング・再現)。
      # timeout-minutesはそれでも詰まった場合に長時間占有せず早期に失敗させるための保険。
      - name: Install Playwright browser
        working-directory: frontend
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium

      # モックLLMサーバー・バックエンド・フロントエンドをバックグラウンドで起動する。
      # 実LLM(APIキー・GPU)は使わず、scripts/e2e_mock_llm.pyがDEFの標準TGWバックエンド
      # (llm/adapters/tgw.py)向けにOpenAI互換の固定レスポンスを返す。CIには
      # data/llm_services.json（gitignore対象）が存在しないため、LLM_BACKENDは
      # 未設定時textgen_webuiへ自動フォールバックする(llm/backend.py参照)。
      # バックエンドはmain.py単体ではなくdual_run.py経由で起動する
      # （同一appオブジェクトを使うため既存シナリオへの影響は無く、副産物として
      # public_main.pyの公開ポート(8512)がguest_onboarding.js向けに同一プロセス
      # ・同一_sessionsシングルトンで立ち上がる。--no-trust-cloudflare-tunnelは
      # 実トンネルの無いCI環境でCF-Connecting-IPヘッダーを誤って信用しないため、
      # --cloudflare-tunnelは実cloudflaredの起動が不要なため付けない、2026-08-23）。
      - name: Start mock LLM, backend, frontend
        env:
          TEXTGEN_WEBUI_URL: http://127.0.0.1:5000/v1
        run: |
          python scripts/e2e_mock_llm.py --port 5000 > mock_llm.log 2>&1 &
          TEXTGEN_WEBUI_URL="$TEXTGEN_WEBUI_URL" python -m def_kari.api.dual_run --local-port 8511 --public-port 8512 --no-trust-cloudflare-tunnel > backend.log 2>&1 &
          (cd frontend && npm run dev > ../frontend.log 2>&1 &)

      - name: Wait for services to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/v1/models >/dev/null && break
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8511/api/health >/dev/null && break
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8512/api/health >/dev/null && break
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000 >/dev/null && break
            sleep 1
          done

      # 投票の弁明ラウンド(vote_expel)を含む、実時間待ちの無いシナリオを毎回実行する。
      # vote_expelは「投票強制賛成」グローバル設定を書き換えるため他シナリオへの影響を
      # 避けて最後に置く（frontend/e2e/README.md参照）。各行はbash -eの下で実行される
      # ため、いずれか1本が失敗すると後続は一切実行されない。ai-turn-dedupは8並列送信
      # の「1件だけ成功するはず」判定が、モックLLMの応答が速すぎるためAIターンの
      # ラウンド巻き戻りと人間側の残りリクエストが衝突し、稀に2件成功してしまう
      # 既知のタイミングflakeを持つ(2026-08-22、trpg_keeper_online_join.js追加作業中の
      # 実CIで連続再現・TODO.md参照)。新規シナリオがこれに巻き込まれて実行されない
      # 事態を避けるため、ai-turn-dedupより前に配置する。
      - name: Run e2e scenarios
        working-directory: frontend
        timeout-minutes: 8
        run: |
          npm run e2e:ws-auth
          npm run e2e:message-sync
          npm run e2e:trpg-keeper-online-join
          npm run e2e:ai-takeover
          npm run e2e:trpg-guest-sheet-join
          npm run e2e:guest-onboarding
          npm run e2e:ai-turn-dedup
          npm run e2e:jwt-regen
          npm run e2e:disconnect-timeout
          npm run e2e:rate-limit
          npm run e2e:host-disconnect
          npm run e2e:invite-rating
          npm run e2e:full-integration
          npm run e2e:vote-expel
          npm run e2e:vote-expel-defense-and-handover

      # 実時間で~2分・~6分かかる2本は既定で除外し、手動実行時の任意指定のみで走らせる。
      - name: Run slow e2e scenarios (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.include_slow == 'true'
        working-directory: frontend
        run: |
          npm run e2e:keepalive
          npm run e2e:all-disconnect-autostop

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-service-logs
          path: |
            mock_llm.log
            backend.log
            frontend.log
